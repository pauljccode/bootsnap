name: Affected Ruby source encoding

on:
  push:
    branches: [ci/source-encoding-revised]

permissions:
  contents: read

jobs:
  affected:
    name: Affected Ruby 3.4.9 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.9'
          bundler-cache: true
      - name: Original failure and corrected suite on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call ridk enable
          if errorlevel 1 exit /b 1
          ruby ci/verify-source-encoding.rb
      - name: Original failure and corrected suite on Linux
        if: runner.os != 'Windows'
        run: ruby ci/verify-source-encoding.rb
      - name: Retain suite output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affected-ruby-${{ matrix.os }}
          path: suite-logs
          if-no-files-found: error
          retention-days: 7
